suite: Istio and Kubernetes Gateway API routing
release:
  name: rel
  namespace: nxs
set:
  existingSecret.enabled: true
  existingSecret.name: app-secret

tests:
  - it: renders no gateway resources by default
    templates:
      - templates/istio.yaml
      - templates/gateway-api.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Istio VirtualService to the frontend through an existing gateway
    templates:
      - templates/istio.yaml
    set:
      ingress.host: alerts.example.com
      istio.virtualService.enabled: true
      istio.virtualService.gateways:
        - istio-system/public
      istio.virtualService.annotations:
        external-dns.alpha.kubernetes.io/hostname: alerts.example.com
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/hostname"]
          value: alerts.example.com
      - equal:
          path: spec.hosts[0]
          value: alerts.example.com
      - equal:
          path: spec.gateways[0]
          value: istio-system/public
      - equal:
          path: spec.http[0].route[0].destination.host
          value: rel-nxs-anomaly-frontend.nxs.svc.cluster.local
      - equal:
          path: spec.http[0].route[0].destination.port.number
          value: 8080

  - it: names the VirtualService after the release by default
    templates:
      - templates/istio.yaml
    set:
      ingress.host: alerts.example.com
      istio.virtualService.enabled: true
    asserts:
      # The default is load-bearing: renaming a VirtualService on upgrade drops
      # the route until the new object is reconciled.
      - equal:
          path: metadata.name
          value: rel-nxs-anomaly

  - it: takes an explicit VirtualService name so two releases can share a routing namespace
    templates:
      - templates/istio.yaml
    set:
      ingress.host: alerts.example.com
      istio.virtualService.enabled: true
      istio.virtualService.namespace: app-routes
      istio.virtualService.name: nxs-anomaly-ee-team-x
    asserts:
      - equal:
          path: metadata.name
          value: nxs-anomaly-ee-team-x
      - equal:
          path: metadata.namespace
          value: app-routes
      # Only the object's own name moves: what it routes to is still this
      # release's service, which is the whole point of naming it separately.
      - equal:
          path: spec.http[0].route[0].destination.host
          value: rel-nxs-anomaly-frontend.nxs.svc.cluster.local

  - it: routes Istio directly to the API when the frontend is disabled
    templates:
      - templates/istio.yaml
    set:
      frontend.enabled: false
      istio.virtualService.enabled: true
      istio.virtualService.hosts:
        - api.example.com
      istio.virtualService.gateways:
        - mesh
    asserts:
      - equal:
          path: spec.http[0].route[0].destination.host
          value: rel-nxs-anomaly-api.nxs.svc.cluster.local
      - equal:
          path: spec.http[0].route[0].destination.port.number
          value: 8080

  - it: creates an Istio Gateway with TLS and auto-attaches the VirtualService
    templates:
      - templates/istio.yaml
    documentSelector:
      path: kind
      value: VirtualService
    set:
      ingress.host: alerts.example.com
      istio.virtualService.enabled: true
      istio.virtualService.namespace: app-routes
      istio.gateway.enabled: true
      istio.gateway.name: edge
      istio.gateway.namespace: istio-system
      istio.gateway.tls.enabled: true
      istio.gateway.tls.credentialName: alerts-tls
    asserts:
      - equal:
          path: spec.gateways[0]
          value: istio-system/edge

  - it: renders the managed Istio Gateway TLS server
    templates:
      - templates/istio.yaml
    documentSelector:
      path: kind
      value: Gateway
    set:
      ingress.host: alerts.example.com
      istio.virtualService.enabled: true
      istio.gateway.enabled: true
      istio.gateway.name: edge
      istio.gateway.namespace: istio-system
      istio.gateway.tls.enabled: true
      istio.gateway.tls.credentialName: alerts-tls
    asserts:
      - equal:
          path: metadata.namespace
          value: istio-system
      - equal:
          path: spec.servers[1].tls.credentialName
          value: alerts-tls

  - it: rejects an enabled Istio Gateway without a name
    templates:
      - templates/istio.yaml
    set:
      istio.gateway.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "istio.gateway.name is required when istio.gateway.enabled"

  - it: renders an HTTPRoute to the frontend through an existing Gateway
    templates:
      - templates/gateway-api.yaml
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.hostnames:
        - alerts.example.com
      gatewayAPI.httpRoute.parentRefs:
        - name: public
          namespace: gateways
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: public
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateways
      - equal:
          path: spec.hostnames[0]
          value: alerts.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: rel-nxs-anomaly-frontend
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: creates a Gateway API Gateway with TLS and auto-attaches the HTTPRoute
    templates:
      - templates/gateway-api.yaml
    documentSelector:
      path: kind
      value: HTTPRoute
    set:
      ingress.host: alerts.example.com
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.gateway.enabled: true
      gatewayAPI.gateway.name: edge
      gatewayAPI.gateway.gatewayClassName: istio
      gatewayAPI.gateway.tls.enabled: true
      gatewayAPI.gateway.tls.secretName: alerts-tls
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: edge

  - it: renders the managed Gateway API TLS listener
    templates:
      - templates/gateway-api.yaml
    documentSelector:
      path: kind
      value: Gateway
    set:
      ingress.host: alerts.example.com
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.gateway.enabled: true
      gatewayAPI.gateway.name: edge
      gatewayAPI.gateway.gatewayClassName: istio
      gatewayAPI.gateway.tls.enabled: true
      gatewayAPI.gateway.tls.secretName: alerts-tls
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: istio
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: alerts-tls

  - it: creates a ReferenceGrant for a cross-namespace HTTPRoute backend
    templates:
      - templates/gateway-api.yaml
    documentSelector:
      path: kind
      value: HTTPRoute
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.namespace: routes
      gatewayAPI.httpRoute.parentRefs:
        - name: public
      gatewayAPI.httpRoute.hostnames:
        - alerts.example.com
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].namespace
          value: nxs

  - it: scopes the cross-namespace ReferenceGrant to this HTTPRoute backend
    templates:
      - templates/gateway-api.yaml
    documentSelector:
      path: kind
      value: ReferenceGrant
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.namespace: routes
      gatewayAPI.httpRoute.parentRefs:
        - name: public
      gatewayAPI.httpRoute.hostnames:
        - alerts.example.com
    asserts:
      - equal:
          path: metadata.namespace
          value: nxs
      - equal:
          path: spec.from[0].namespace
          value: routes
      - equal:
          path: spec.to[0].name
          value: rel-nxs-anomaly-frontend

  - it: takes an explicit HTTPRoute name, and the ReferenceGrant follows it
    templates:
      - templates/gateway-api.yaml
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.name: nxs-anomaly-ee-team-x
      gatewayAPI.httpRoute.namespace: routes
      gatewayAPI.httpRoute.parentRefs:
        - name: public
      gatewayAPI.httpRoute.hostnames:
        - alerts.example.com
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.name
          value: nxs-anomaly-ee-team-x
      # The grant exists only for this route: under the old name it would be an
      # orphan, and the route would have no permission to reach the backend.
      - documentIndex: 1
        equal:
          path: metadata.name
          value: nxs-anomaly-ee-team-x-httproute
      - documentIndex: 0
        equal:
          path: spec.rules[0].backendRefs[0].name
          value: rel-nxs-anomaly-frontend

  - it: names the HTTPRoute after the release by default
    templates:
      - templates/gateway-api.yaml
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.parentRefs:
        - name: public
      gatewayAPI.httpRoute.hostnames:
        - alerts.example.com
    asserts:
      - equal:
          path: metadata.name
          value: rel-nxs-anomaly

  - it: rejects an HTTPRoute without parentRefs or a managed Gateway
    templates:
      - templates/gateway-api.yaml
    set:
      gatewayAPI.httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gatewayAPI.httpRoute: set parentRefs or enable gatewayAPI.gateway"

  - it: rejects a cross-namespace managed Gateway that only allows same-namespace routes
    templates:
      - templates/gateway-api.yaml
    set:
      gatewayAPI.httpRoute.enabled: true
      gatewayAPI.httpRoute.namespace: routes
      gatewayAPI.gateway.enabled: true
      gatewayAPI.gateway.name: edge
      gatewayAPI.gateway.namespace: gateways
    asserts:
      - failedTemplate:
          errorMessage: "gatewayAPI: a managed Gateway in another namespace cannot use allowedRoutes.namespaces.from=Same"
