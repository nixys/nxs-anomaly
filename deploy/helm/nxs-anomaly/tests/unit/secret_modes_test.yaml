suite: secret sourcing modes
release:
  name: rel
  namespace: nxs
templates:
  - templates/secret.yaml
  - templates/externalsecret.yaml
  - templates/vaultstaticsecret.yaml
  - templates/vaultauth.yaml
  - templates/vaultstaticsecret-extra.yaml
  - templates/configmap.yaml
tests:
  - it: inline mode renders a Secret and auto-fills the DB DSN from bundled Postgres
    template: templates/secret.yaml
    set:
      inlineSecret.enabled: true
      postgresql.enabled: true
    asserts:
      - isKind: {of: Secret}
      - equal:
          path: metadata.name
          value: rel-nxs-anomaly
      - equal:
          path: data.NXS_ANOMALY_DB_DSN
          value: cG9zdGdyZXM6Ly9ueHNfYW5vbWFseTpjaGFuZ2UtbWVAcmVsLW54cy1hbm9tYWx5LXBvc3RncmVzcWw6NTQzMi9ueHNfYW5vbWFseT9zc2xtb2RlPWRpc2FibGU=

  - it: existingSecret mode renders NO Secret object (chart carries no plaintext)
    template: templates/secret.yaml
    set:
      existingSecret.enabled: true
      existingSecret.name: my-secret
    asserts:
      - hasDocuments: {count: 0}

  - it: external-secrets mode renders an ExternalSecret targeting the chart secret
    template: templates/externalsecret.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: vault-store
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.target.name, value: rel-nxs-anomaly}
      - equal: {path: spec.secretStoreRef.name, value: vault-store}

  - it: VSO mode renders a VaultStaticSecret writing the chart secret
    template: templates/vaultstaticsecret.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.path: kv/nxs-anomaly
    asserts:
      - isKind: {of: VaultStaticSecret}
      - equal: {path: spec.destination.name, value: rel-nxs-anomaly}
      - notExists: {path: spec.vaultAuthRef}

  - it: VSO mode renders no VaultAuth unless asked
    template: templates/vaultauth.yaml
    set:
      vaultSecretOperator.enabled: true
    asserts:
      - hasDocuments: {count: 0}

  - it: chart-managed VaultAuth renders kubernetes auth against an existing VaultConnection
    template: templates/vaultauth.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.vaultAuth.create: true
      vaultSecretOperator.vaultAuth.mount: kubernetes
      vaultSecretOperator.vaultAuth.vaultConnectionRef: vault-prod
      vaultSecretOperator.vaultAuth.kubernetes.role: nxs-anomaly
      vaultSecretOperator.vaultAuth.kubernetes.audiences: [vault]
    asserts:
      - isKind: {of: VaultAuth}
      - equal: {path: metadata.name, value: rel-nxs-anomaly}
      - equal: {path: spec.method, value: kubernetes}
      - equal: {path: spec.mount, value: kubernetes}
      - equal: {path: spec.vaultConnectionRef, value: vault-prod}
      - equal: {path: spec.kubernetes.role, value: nxs-anomaly}
      # defaults to the chart's own ServiceAccount
      - equal: {path: spec.kubernetes.serviceAccount, value: rel-nxs-anomaly}
      - equal: {path: spec.kubernetes.audiences, value: [vault]}

  - it: the VaultStaticSecret binds to the chart-managed VaultAuth
    template: templates/vaultstaticsecret.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.vaultAuth.create: true
      vaultSecretOperator.vaultAuth.mount: kubernetes
      vaultSecretOperator.vaultAuth.vaultConnectionRef: vault-prod
      vaultSecretOperator.vaultAuth.kubernetes.role: nxs-anomaly
    asserts:
      - equal: {path: spec.vaultAuthRef, value: rel-nxs-anomaly}

  - it: chart-managed VaultAuth renders jwt auth for clusters Vault cannot reach
    template: templates/vaultauth.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.vaultAuth.create: true
      vaultSecretOperator.vaultAuth.method: jwt
      vaultSecretOperator.vaultAuth.mount: jwt-sandbox-k8s
      vaultSecretOperator.vaultAuth.vaultConnectionRef: vault-secrets-operator/default
      vaultSecretOperator.vaultAuth.jwt.role: devops_service_sandbox_nxs_anomaly
      vaultSecretOperator.vaultAuth.jwt.serviceAccount: nxs-anomaly-ro-secret
      vaultSecretOperator.vaultAuth.jwt.audiences: [nxs-anomaly]
    asserts:
      - isKind: {of: VaultAuth}
      - equal: {path: spec.method, value: jwt}
      - equal: {path: spec.mount, value: jwt-sandbox-k8s}
      - equal: {path: spec.vaultConnectionRef, value: vault-secrets-operator/default}
      - equal: {path: spec.jwt.role, value: devops_service_sandbox_nxs_anomaly}
      - equal: {path: spec.jwt.serviceAccount, value: nxs-anomaly-ro-secret}
      - equal: {path: spec.jwt.audiences, value: [nxs-anomaly]}
      - notExists: {path: spec.kubernetes}

  - it: an unsupported VaultAuth method is refused rather than rendered authless
    template: templates/vaultauth.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.vaultAuth.create: true
      vaultSecretOperator.vaultAuth.method: appRole
      vaultSecretOperator.vaultAuth.mount: approle
      vaultSecretOperator.vaultAuth.vaultConnectionRef: vault-prod
    asserts:
      - failedTemplate:
          errorMessage: "vaultSecretOperator.vaultAuth.method=\"appRole\" is not supported by this chart — use \"kubernetes\" or \"jwt\", or manage the VaultAuth outside the release via vaultSecretOperator.vaultAuthRef"

  - it: a chart-managed VaultAuth without a VaultConnection is refused
    template: templates/vaultauth.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.vaultAuth.create: true
      vaultSecretOperator.vaultAuth.mount: kubernetes
      vaultSecretOperator.vaultAuth.kubernetes.role: nxs-anomaly
    asserts:
      - failedTemplate:
          errorMessage: "vaultSecretOperator.vaultAuth.vaultConnectionRef is required — name the existing VaultConnection; leaving it empty makes VSO fall back to its default one"

  - it: extra VaultStaticSecrets inherit the main block and pass transformation through
    template: templates/vaultstaticsecret-extra.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.mount: nixys-main-kv
      vaultSecretOperator.refreshAfter: 10s
      vaultSecretOperator.vaultAuthRef: platform-auth
      vaultSecretOperator.extraSecrets.hub-auth.path: apps/nxs-anomaly/prod/harbor
      vaultSecretOperator.extraSecrets.hub-auth.destination.name: nxs-anomaly-hub-auth
      vaultSecretOperator.extraSecrets.hub-auth.destination.type: kubernetes.io/dockerconfigjson
      vaultSecretOperator.extraSecrets.hub-auth.destination.transformation.excludeRaw: true
    asserts:
      - isKind: {of: VaultStaticSecret}
      - equal: {path: metadata.name, value: rel-nxs-anomaly-hub-auth}
      # inherited from the main vaultSecretOperator block
      - equal: {path: spec.mount, value: nixys-main-kv}
      - equal: {path: spec.type, value: kv-v2}
      - equal: {path: spec.refreshAfter, value: "10s"}
      - equal: {path: spec.vaultAuthRef, value: platform-auth}
      - equal: {path: spec.path, value: apps/nxs-anomaly/prod/harbor}
      - equal: {path: spec.destination.name, value: nxs-anomaly-hub-auth}
      - equal: {path: spec.destination.type, value: kubernetes.io/dockerconfigjson}
      - equal: {path: spec.destination.transformation.excludeRaw, value: true}

  - it: an extra Secret without a destination name is refused
    template: templates/vaultstaticsecret-extra.yaml
    set:
      vaultSecretOperator.enabled: true
      vaultSecretOperator.extraSecrets.hub-auth.path: apps/nxs-anomaly/prod/harbor
    asserts:
      - failedTemplate:
          errorMessage: "vaultSecretOperator.extraSecrets.hub-auth.destination.name is required — the Secret this creates is referenced by name elsewhere, so the chart will not guess it"

  - it: extra Secrets without the VSO mode enabled are refused
    template: templates/configmap.yaml
    set:
      inlineSecret.enabled: true
      vaultSecretOperator.enabled: false
      vaultSecretOperator.extraSecrets.hub-auth.path: apps/nxs-anomaly/prod/harbor
      vaultSecretOperator.extraSecrets.hub-auth.destination.name: nxs-anomaly-hub-auth
    asserts:
      - failedTemplate:
          errorMessage: "vaultSecretOperator.extraSecrets is set with vaultSecretOperator.enabled=false: those Secrets would never be created, and whatever references them by name — imagePullSecrets, most likely — would keep the pods from starting"

  - it: no secret source enabled fails the render
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "No secret source enabled. Set one of existingSecret / externalSecrets / vaultSecretOperator / inlineSecret to provide NXS_ANOMALY_DB_DSN."
