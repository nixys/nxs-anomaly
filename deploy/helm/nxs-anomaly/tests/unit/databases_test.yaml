suite: bundled vs external data services
release:
  name: rel
  namespace: nxs
set:
  existingSecret.enabled: true
  existingSecret.name: app-secret
tests:
  - it: bundled postgres renders a Secret, StatefulSet and Service
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: true
    asserts:
      - hasDocuments: {count: 3}

  - it: bundled postgres StatefulSet is named after the release
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal: {path: metadata.name, value: rel-nxs-anomaly-postgresql}

  - it: bundled postgres meets Pod Security "restricted"
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal: {path: spec.template.spec.securityContext.runAsNonRoot, value: true}
      - equal: {path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault}
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
  - it: bundled postgres renders its CPU limit the way the API server stores it
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1
  - it: bundled postgres writes its claim template the way the API server stores it
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].apiVersion
          value: v1
      - equal:
          path: spec.volumeClaimTemplates[0].kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeMode
          value: Filesystem
  - it: disabled postgres renders nothing
    templates:
      - templates/postgresql.yaml
    set:
      postgresql.enabled: false
    asserts:
      - hasDocuments: {count: 0}

  - it: keeps the bundled PostgreSQL pod template free of chart and version labels
    templates: [templates/postgresql.yaml]
    set:
      postgresql.enabled: true
    documentIndex: 1
    asserts:
      # These two change on every chart bump. In a StatefulSet pod template they
      # produce a new controller revision, so an upgrade that changes nothing
      # about the database still restarts the pod holding the data.
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: postgresql
