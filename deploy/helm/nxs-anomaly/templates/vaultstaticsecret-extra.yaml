{{- /*
Additional VaultStaticSecrets alongside the application one. The release needs
Secrets it does not consume as environment — an image pull Secret being the
usual case: the workloads reference it by name in imagePullSecrets, so it has
to exist in the namespace, but it is not part of the application config.

Auth, mount and refresh default to the main vaultSecretOperator block: an extra
Secret read from the same Vault under a different path is the common shape, and
repeating the auth wiring per entry invites the two to drift apart.

destination.type and destination.transformation are passed through to VSO,
which is what turns Vault fields into a kubernetes.io/dockerconfigjson payload
without anything in this chart having to know the registry's format. The Go
template inside transformation.templates is evaluated by VSO, not by Helm —
values files are not templated, so it arrives verbatim. Never run it through
tpl.
*/ -}}
{{- if .Values.vaultSecretOperator.enabled }}
{{- range $name, $s := .Values.vaultSecretOperator.extraSecrets }}
{{- $d := default dict $s.destination }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ printf "%s-%s" (include "nxs-anomaly.fullname" $) $name }}
  labels:
    {{- include "nxs-anomaly.labels" $ | nindent 4 }}
spec:
  type: {{ default $.Values.vaultSecretOperator.type $s.type }}
  mount: {{ default $.Values.vaultSecretOperator.mount $s.mount }}
  path: {{ required (printf "vaultSecretOperator.extraSecrets.%s.path is required" $name) $s.path }}
  refreshAfter: {{ default $.Values.vaultSecretOperator.refreshAfter $s.refreshAfter | quote }}
  {{- with include "nxs-anomaly.vaultAuthRef" $ }}
  vaultAuthRef: {{ . }}
  {{- end }}
  destination:
    create: true
    name: {{ required (printf "vaultSecretOperator.extraSecrets.%s.destination.name is required — the Secret this creates is referenced by name elsewhere, so the chart will not guess it" $name) $d.name }}
    {{- with $d.type }}
    type: {{ . }}
    {{- end }}
    labels:
      {{- include "nxs-anomaly.labels" $ | nindent 6 }}
    {{- with $d.transformation }}
    transformation:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
