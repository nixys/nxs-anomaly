{{- if .Values.tests.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nxs-anomaly.fullname" . }}-test-connection
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
    # A component label so NetworkPolicy can name these pods. Without one they
    # carry the release's selector labels, are caught by the default-deny and
    # have no rule of their own — `helm test` then fails on a policy-enabled
    # install for reasons that have nothing to do with what it is testing.
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["/bin/sh", "-c"]
      args:
        - >-
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused
          http://{{ include "nxs-anomaly.componentName" (dict "ctx" . "component" "api") }}:{{ .Values.api.service.port }}/health
{{- end }}
