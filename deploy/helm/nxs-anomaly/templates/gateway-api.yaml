{{- $route := .Values.gatewayAPI.httpRoute -}}
{{- $gateway := .Values.gatewayAPI.gateway -}}
{{- if $route.enabled }}
{{- $routeNamespace := default .Release.Namespace $route.namespace -}}
{{- $parentRefs := $route.parentRefs -}}
{{- if and (not $parentRefs) $gateway.enabled -}}
{{-   $gatewayName := required "gatewayAPI.gateway.name is required when gatewayAPI.gateway.enabled" $gateway.name -}}
{{-   $gatewayNamespace := default .Release.Namespace $gateway.namespace -}}
{{-   $parentRef := dict "name" $gatewayName -}}
{{-   if ne $gatewayNamespace $routeNamespace -}}
{{-     if eq (dig "namespaces" "from" "Same" $gateway.allowedRoutes) "Same" -}}
{{-       fail "gatewayAPI: a managed Gateway in another namespace cannot use allowedRoutes.namespaces.from=Same" -}}
{{-     end -}}
{{-     $_ := set $parentRef "namespace" $gatewayNamespace -}}
{{-   end -}}
{{-   $parentRefs = list $parentRef -}}
{{- end -}}
{{- if not $parentRefs -}}
{{-   fail "gatewayAPI.httpRoute: set parentRefs or enable gatewayAPI.gateway" -}}
{{- end -}}
{{- $hostnames := $route.hostnames -}}
{{- if not $hostnames -}}
{{-   $hostnames = list (required "gatewayAPI.httpRoute: set hostnames or ingress.host" .Values.ingress.host) -}}
{{- end -}}
{{- $serviceName := include "nxs-anomaly.componentName" (dict "ctx" . "component" "api") -}}
{{- $servicePort := .Values.api.service.port -}}
{{- if .Values.frontend.enabled -}}
{{-   $serviceName = include "nxs-anomaly.componentName" (dict "ctx" . "component" "frontend") -}}
{{-   $servicePort = .Values.frontend.service.port -}}
{{- end -}}
{{- /*
  Settable for the same reason as the VirtualService name, and more sharply so:
  an HTTPRoute is routinely placed in a routing namespace shared with every other
  route in the cluster, where two releases of this chart would render one object
  under one name and a GitOps controller would see it owned by two applications.

  Defaults to the release's full name — renaming a route deletes it and creates
  another, and traffic to the host stops in between.
*/ -}}
{{- $routeName := default (include "nxs-anomaly.fullname" .) $route.name -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ $routeNamespace }}
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml $hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $serviceName }}
          {{- if ne $routeNamespace .Release.Namespace }}
          namespace: {{ .Release.Namespace }}
          {{- end }}
          port: {{ $servicePort }}
{{ if ne $routeNamespace .Release.Namespace }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  {{- /* Named after the route it exists for, so a renamed route keeps its grant
      recognisably beside it rather than under the old name. */}}
  name: {{ printf "%s-httproute" $routeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $routeNamespace }}
  to:
    - group: ""
      kind: Service
      name: {{ $serviceName }}
{{ end }}
{{ end }}
{{- if $gateway.enabled }}
{{- $gatewayName := required "gatewayAPI.gateway.name is required when gatewayAPI.gateway.enabled" $gateway.name -}}
{{- $gatewayNamespace := default .Release.Namespace $gateway.namespace -}}
{{- $gatewayHost := $gateway.hostname -}}
{{- if not $gatewayHost -}}
{{-   if $route.hostnames -}}
{{-     $gatewayHost = first $route.hostnames -}}
{{-   else -}}
{{-     $gatewayHost = required "gatewayAPI.gateway: set hostname, httpRoute.hostnames or ingress.host" .Values.ingress.host -}}
{{-   end -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
  {{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gatewayAPI.gateway.gatewayClassName is required" $gateway.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $gatewayHost | quote }}
      allowedRoutes:
        {{- toYaml $gateway.allowedRoutes | nindent 8 }}
    {{- if $gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $gatewayHost | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "gatewayAPI.gateway.tls.secretName is required when TLS is enabled" $gateway.tls.secretName }}
      allowedRoutes:
        {{- toYaml $gateway.allowedRoutes | nindent 8 }}
    {{- end }}
{{- end }}
