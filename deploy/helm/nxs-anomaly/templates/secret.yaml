{{- /*
Secret sourcing. Exactly one of the four modes should be the primary provider of
NXS_ANOMALY_DB_DSN and credentials. This template renders the materialised Secret
for the inline (dev) mode only; existingSecret references an operator-managed
Secret, and the external-secrets / VSO modes render their own CRs (which produce
a Secret named after the chart at runtime).
*/ -}}
{{- $modes := list .Values.existingSecret.enabled .Values.externalSecrets.enabled .Values.vaultSecretOperator.enabled .Values.inlineSecret.enabled -}}
{{- $count := 0 -}}
{{- range $modes }}{{- if . }}{{- $count = add1 $count }}{{- end }}{{- end }}
{{- if eq $count 0 }}
{{- fail "No secret source enabled. Set one of existingSecret / externalSecrets / vaultSecretOperator / inlineSecret to provide NXS_ANOMALY_DB_DSN." }}
{{- end }}
{{- if .Values.inlineSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nxs-anomaly.fullname" . }}
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
type: Opaque
# data, not stringData: the API server moves stringData into data, so a key
# dropped from values was removed from a field the live Secret no longer had and
# survived the upgrade — including a rollback. A revoked ChatOps token that stays
# valid is the whole problem, so the keys are rendered where they are stored.
data:
  {{- if not (hasKey .Values.inlineSecret.data "NXS_ANOMALY_DB_DSN") }}
  NXS_ANOMALY_DB_DSN: {{ include "nxs-anomaly.dbDsn" . | b64enc | quote }}
  {{- end }}
  {{- range $k, $v := .Values.inlineSecret.data }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
