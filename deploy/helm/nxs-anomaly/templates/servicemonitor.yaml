{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
{{/*
  The CRD check is not defensiveness for its own sake. Without it, enabling the
  flag on a cluster that has no Prometheus Operator emits a manifest of an
  unknown kind, and a GitOps controller then fails to sync the ENTIRE release —
  one observability toggle takes the whole application out of reconciliation.
  Observed on a dev cluster, where this is exactly why the flag had to stay off.

  The trade is a silent no-op where the CRDs are missing. That is the lesser
  harm: nothing you had keeps working either way, and the readiness report
  already tells an operator whether metrics are being scraped.
*/}}
{{- $targets := list (dict "component" "api" "port" "http") (dict "component" "worker" "port" "telemetry") -}}
{{- range $t := $targets }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nxs-anomaly.componentName" (dict "ctx" $ "component" $t.component) }}
  labels:
    {{- include "nxs-anomaly.componentLabels" (dict "ctx" $ "component" $t.component) | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nxs-anomaly.componentSelectorLabels" (dict "ctx" $ "component" $t.component) | nindent 6 }}
  endpoints:
    - port: {{ $t.port }}
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
