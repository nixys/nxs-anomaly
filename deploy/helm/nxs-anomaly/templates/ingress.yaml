{{- if .Values.ingress.enabled -}}
{{- $svc := ternary (include "nxs-anomaly.componentName" (dict "ctx" . "component" "frontend")) (include "nxs-anomaly.componentName" (dict "ctx" . "component" "api")) .Values.frontend.enabled -}}
{{- $port := ternary .Values.frontend.service.port .Values.api.service.port .Values.frontend.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nxs-anomaly.fullname" . }}
  labels:
    {{- include "nxs-anomaly.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ $port }}
{{- end }}
