# A ready-to-look-at demo: team, on-call rotation, escalation chain, webhook
# integration and one firing alert, created on first start.
#
#   docker compose -f deploy/demo/compose.yaml up -d
#   open http://localhost:3100 and sign in as alice / demo-password
#
# Evaluation only: the credentials below are public, and notifications go to
# the worker log instead of a real channel. Start over with `down -v`.
name: nxs-anomaly-demo

x-image: &image ghcr.io/nixys/nxs-anomaly:${NXS_ANOMALY_VERSION:-latest}
x-db: &db
  NXS_ANOMALY_DB_DSN: postgres://nxs_anomaly:demo-password@postgres:5432/nxs_anomaly?sslmode=disable
  NXS_ANOMALY_DB_CONNECT_MAX_WAIT_SECONDS: "60"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nxs_anomaly
      POSTGRES_USER: nxs_anomaly
      POSTGRES_PASSWORD: demo-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U nxs_anomaly -d nxs_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs on every `up`; --if-empty makes later runs a no-op, so what you change
  # in the demo survives a restart. It seeds before the API starts because the
  # API's bootstrap admin below is the seeded user alice, promoted to admin.
  seed:
    image: *image
    command: [/usr/local/bin/nxs-anomaly, seed-demo, --if-empty, --sample-alert]
    environment: *db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: *image
    restart: unless-stopped
    environment:
      <<: *db
      NXS_ANOMALY_START_SCHEDULER: "false"
      NXS_ANOMALY_BOOTSTRAP_ADMIN_USERNAME: alice
      NXS_ANOMALY_BOOTSTRAP_ADMIN_PASSWORD: demo-password
      NXS_ANOMALY_SESSION_COOKIE_SECURE: "false"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/nxs-anomaly, healthcheck, --url, "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: *image
    restart: unless-stopped
    command: [/usr/local/bin/nxs-anomaly, run-worker, --poll-interval, "5", --worker-addr, ":8081"]
    environment: *db
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/nxs-anomaly, healthcheck, --url, "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ghcr.io/nixys/nxs-anomaly-frontend:${NXS_ANOMALY_VERSION:-latest}
    restart: unless-stopped
    environment:
      NXS_ANOMALY_API_UPSTREAM: app:8080
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:8080"

volumes:
  pgdata:
