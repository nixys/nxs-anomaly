<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
<title id="title">nxs-anomaly Community: from alert to response</title>
<desc id="desc">Monitoring sources send alerts to the API. Source parsing precedes route selection on original labels, optional enrichment or filtering, and deduplication into alert groups. A worker executes the selected escalation chain using on-call schedules or direct recipients, and delivers notifications. Without acknowledgement, configured escalation steps continue. Delivery failures have separate retries and a dead-letter outcome. Acknowledgement stops escalation; manual resolution or source recovery closes the group, even without acknowledgement. PostgreSQL persists configuration, alert state, escalation progress and delivery history. Web UI, REST API and Terraform configure the service.</desc>
<defs>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#F2D36A"/><stop offset=".5" stop-color="#E6B936"/><stop offset="1" stop-color="#A97812"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E6B936" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L11 6L1 11Z" fill="#E6B936"/></marker>
<marker id="softarrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L11 6L1 11Z" fill="#A9A397"/></marker>
<style>
text {font-family:Inter,"DejaVu Sans",sans-serif}
