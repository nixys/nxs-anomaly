# Nightly vulnerability scan — the thing SECURITY.md promises for this
# repository. `ci.yml` already runs govulncheck on every push and pull request,
# but a new advisory publishes on its own schedule, not on this repository's
# commit schedule: a quiet week here would otherwise be a week nobody re-checked
# already-vendored dependencies against the day's advisory database.
#
# Two ecosystems, the same two gates the rest of the project uses — see
# SECURITY.md's "Dependency policy" table — so a finding here is the same kind
# of finding a contributor would have seen locally or in ci.yml, not a second
# mechanism to learn.
name: security-nightly

on:
  schedule:
    # 03:17 UTC — off the hour, so this does not compete with every other
    # repository's midnight cron for shared runner capacity.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22.12'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Pinned — see ci.yml's govulncheck job for why @latest is unsafe here.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Vulnerability gate
        run: GOVULNCHECK="$(go env GOPATH)/bin/govulncheck" bash scripts/vuln-gate.sh

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit gate
        run: node scripts/audit-gate.mjs --level=high --omit-dev

  # A scheduled job fails silently unless something looks at the run. This
  # opens (or updates) one tracking issue per failure kind rather than paging
  # anyone — a nightly dependency scan is a thing to notice by morning, not an
  # incident.
  report-failure:
    runs-on: ubuntu-latest
    needs: [govulncheck, frontend-audit]
    if: failure()
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'security-nightly failed';
            const body = `The nightly dependency scan failed: ` +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security-nightly',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['security-nightly'],
              });
            }
