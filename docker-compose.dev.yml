services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nxs_anomaly
      POSTGRES_USER: nxs_anomaly
      # ${VAR:?msg} — compose refuses to start the container rather than fall
      # back to a guessable password. Set it in .env (cp .env.example .env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
    volumes:
      # Named, not anonymous: an anonymous volume is not guaranteed to be the
      # one a later `docker compose up` reattaches, so "data survives down/up"
      # would not actually hold. `docker compose down -v` removes this volume
      # on purpose — that is the documented way to start over.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxs_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NXS_ANOMALY_DB_DSN: postgres://nxs_anomaly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}@postgres:5432/nxs_anomaly?sslmode=disable
      NXS_ANOMALY_START_SCHEDULER: "false"
      # Local dev stack only. The Grafana plugin performs its install handshake
      # on its own schedule and with the Grafana service-account token, which
      # this compose file generates at runtime and cannot pre-share. In a real
      # deployment set NXS_ANOMALY_GRAFANA_INSTALL_TOKEN instead and leave this
      # unset — see docs/API.md.
      NXS_ANOMALY_GRAFANA_COMPAT_ALLOW_ANONYMOUS: "true"
      # The management API refuses every request without a credential, so the
      # dev stack needs a way in. Bootstrap admin rather than
      # NXS_ANOMALY_ALLOW_ANONYMOUS on purpose: it exercises the same sign-in
      # path a real deployment uses.
      NXS_ANOMALY_BOOTSTRAP_ADMIN_USERNAME: ${NXS_ANOMALY_BOOTSTRAP_ADMIN_USERNAME:?set in .env — see .env.example}
      NXS_ANOMALY_BOOTSTRAP_ADMIN_PASSWORD: ${NXS_ANOMALY_BOOTSTRAP_ADMIN_PASSWORD:?set in .env — see .env.example}
      # This stack serves plain HTTP, and a Secure cookie would be accepted by
      # the browser and then never sent back — sign-in would look like it
      # worked and nothing would stay signed in.
      NXS_ANOMALY_SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - app
    environment:
      NXS_ANOMALY_API_UPSTREAM: app:8080
    ports:
      - "127.0.0.1:3100:8080"

  worker:
    build: .
    command: ["/usr/local/bin/nxs-anomaly", "run-worker", "--poll-interval", "5", "--worker-addr", ":8081"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NXS_ANOMALY_DB_DSN: postgres://nxs_anomaly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}@postgres:5432/nxs_anomaly?sslmode=disable
    # /ready reflects actual usefulness (DB reachable and the cycle loop is not
    # stalled), unlike the app's own /health, whose worker_cycles_completed is
    # process-local and stays zero forever on this replica — the scheduler
    # runs here, not on `app` (NXS_ANOMALY_START_SCHEDULER=false above).
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/nxs-anomaly", "healthcheck", "--url", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
